<header class="site-header">
  <nav class="nav-container">
    <a href="{{ '/' | relative_url }}" class="site-title"><img src="{{ '/assets/images/marcus.png' | relative_url }}" alt="Marcus" class="nav-logo"> WCCA Robotics</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">☰</button>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/ftc' | relative_url }}" {% if page.url == '/ftc' or page.url == '/ftc/' %}class="active"{% endif %}>FTC</a></li>
      <li class="nav-dropdown">
        <a href="{{ '/fll' | relative_url }}" {% if page.url == '/fll' or page.url == '/fll/' or page.url contains '/tournaments' %}class="active"{% endif %}>FLL ▾</a>
        <ul class="nav-dropdown-menu">
          <li><a href="{{ '/fll' | relative_url }}">FLL Teams</a></li>
          <li><a href="{{ '/tournaments/' | relative_url }}">Tournaments</a></li>
        </ul>
      </li>
      <li><a href="{{ '/support' | relative_url }}" {% if page.url == '/support' or page.url == '/support/' %}class="active"{% endif %}>Support Us</a></li>
      <li><a href="{{ '/about' | relative_url }}" {% if page.url == '/about' or page.url == '/about/' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/contact' | relative_url }}" {% if page.url == '/contact' or page.url == '/contact/' %}class="active"{% endif %}>Contact</a></li>
    </ul>
  </nav>
  <script>
    document.querySelectorAll('.nav-dropdown > a').forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
          e.preventDefault();
          this.parentElement.classList.toggle('open');
        }
      });
    });
  </script>
</header>
