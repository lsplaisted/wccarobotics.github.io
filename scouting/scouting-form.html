<style>
  @media print {
    .site-header, .site-footer, .print-instructions, .page-content > *:not(.scouting-forms) { display: none !important; }
    body { margin: 0; padding: 0; }
    .page-content { padding: 0 !important; }
    .scouting-page { page-break-inside: avoid; }
    .form-spacer { height: 24px; }
    .form-spacer-lg { height: 60px; }
  }

  .print-instructions {
    max-width: 800px;
    margin: 2rem auto;
    padding: 1rem 1.5rem;
    background: #f0f4f8;
    border-radius: 8px;
    text-align: center;
  }
  .print-instructions .btn { margin-top: 0.5rem; }

  .scouting-forms {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 1rem;
  }
</style>

<div class="print-instructions">
  <p><strong>FTC Scouting Forms</strong> — Two forms per page. Print as many copies as you need!</p>
  <p>Tip: Set margins to "Minimum" or "None" in your print settings for best results.</p>
  <button class="btn btn-blue" onclick="window.print()">🖨️ Print Scouting Forms</button>
</div>

});
</script>
